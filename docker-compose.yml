name: wave
services:
  web:
    image: ${DOCKER_REGISTRY-}wave
    build:
      context: .
      dockerfile: Wave/Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"
    links:
        - database:db
        - valkey:cache
    environment:
      - TZ=Europe/Berlin
      - WAVE_ConnectionStrings__DefaultConnection=Host=db; Username=wave; Password=development
      - WAVE_ConnectionStrings__Redis=cache
    volumes:
      - wave-files:/app/files
      - wave-config:/configuration
    depends_on:
      valkey:
        condition: service_started
      database:
        condition: service_started
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - "POSTGRES_DB=wave"
      - "POSTGRES_USER=wave"
      - "POSTGRES_PASSWORD=development"
    volumes:
      -  wave-db:/var/lib/postgresql/18/docker
  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - wave-valkey:/data

volumes:
  wave-files:
  wave-config:
  wave-db:
  wave-valkey: