<base-layout [title]="this.article.value()?.title ?? 'Article Not Found'">
	@if(this.article.value(); as article) {
	<article>
		<header class="mb-3">
			<p>
				Published: {{ article.published | date: "dd.MM.yyyy HH:mm:ss" }}
			</p>
			<p>
				Modified: {{ article.modified | date: "dd.MM.yyyy HH:mm:ss" }}
			</p>
		</header>
		<div
			class="[&_h2]:text-2xl [&_h2]:mb-2"
			[innerHTML]="parseBodySafe(article.body!)"
		>
			Loading...
		</div>
	</article>
	} @else {
	<p>No Article found or error</p>
	}
</base-layout>
